<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>季度路演 · 内部版</title>
    <link rel="stylesheet" href="https://cdn.example.com/deck.css" />
    <style>
      .slide {
        animation: slide-in 0.4s ease;
        background: linear-gradient(135deg, #111, #333);
      }
      @keyframes slide-in {
        from {
          transform: translateX(40px);
          opacity: 0;
        }
      }
      .deco {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
    </style>
    <script src="https://cdn.example.com/deck.js"></script>
  </head>
  <body>
    <nav class="deck-nav">
      <a href="#s1">1</a><a href="#s2">2</a><a href="#s3">3</a>
      <button onclick="document.body.classList.toggle('dark')">切换主题</button>
    </nav>
    <div id="deck" class="deck">
      <section class="slide" data-hr-id="fake-anchor" onclick="next()">
        <div class="deco">
          <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" /></svg>
        </div>
        <h1>全年增长 42%</h1>
        <p style="font-size: 2em">关键业务线全部超预期，<b>续约率 96%</b>。</p>
        <p>脚注与来源见附录。</p>
        <script>
          window.slides = window.slides || [];
        </script>
      </section>
      <section class="slide">
        <h2>三条增长曲线</h2>
        <ul>
          <li>产品线 A：同比增长 <strong>68%</strong></li>
          <li>产品线 B：同比增长 31%</li>
          <li>新业务：从 0 到 120 家客户</li>
        </ul>
        <div class="deco" style="background: url(https://cdn.example.com/bg.png)"></div>
      </section>
      <section class="slide">
        <h2>下一步</h2>
        <ol>
          <li>Q1 完成华东区铺开</li>
          <li>Q2 上线自助开通</li>
        </ol>
        <table>
          <thead>
            <tr>
              <th>季度</th>
              <th>目标</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Q1</td>
              <td>300 家</td>
            </tr>
          </tbody>
        </table>
        <img src="https://cdn.example.com/chart.png" alt="外链图（应被剥掉）" />
        <img src="chart.png" alt="本地图（应保留）" />
        <noscript>需要开启 JavaScript 查看动画</noscript>
      </section>
    </div>
    <footer class="deck-footer">内部资料 · 请勿外传</footer>
    <script>
      document.querySelectorAll(".slide").forEach((s, i) => (s.dataset.index = i));
    </script>
  </body>
</html>
