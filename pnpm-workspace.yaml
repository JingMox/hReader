packages:
  - "packages/*"

# Shared dependencies converge here: packages write only `catalog:`, and versions bump in this one place.
catalog:
  "@stryker-mutator/api": 10.1.1
  "@stryker-mutator/core": 10.1.1
  "@stryker-mutator/vitest-runner": 10.1.1
  "@types/node": 26.6.6
  "@vitest/coverage-v8": 3.2.4
  esbuild: 0.28.2
  eslint: 9.39.1
  happy-dom: 21.0.4
  puppeteer-core: 25.18.1
  typescript: 5.9.3
  vitest: 3.2.4
  yaml: 2.9.1
  zod: 3.25.76

# esbuild's install script lands the platform binary; vitest depends on it, so it must not be silently skipped.
allowBuilds:
  esbuild: true
