packages:
  - "packages/*"

# 各包共享的依赖统一收敛到这里：包里只写 `catalog:`，版本只在这一处升级。
catalog:
  "@types/node": 26.6.6
  "@vitest/coverage-v8": 3.2.4
  esbuild: 0.28.2
  eslint: 9.39.1
  happy-dom: 21.0.4
  puppeteer-core: 25.18.1
  typescript: 5.9.3
  vitest: 3.2.4
  yaml: 2.9.1
  zod: 3.25.76

# esbuild 的 install 脚本负责落地平台二进制；vitest 依赖它，禁止静默跳过。
allowBuilds:
  esbuild: true
