<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hReader</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <style id="hr-theme"></style>
    <div id="hr-root">
      <!-- 沉浸模式的兜底出口：iframe 拿焦会吃掉 Esc/i，壳收不到 keydown。
           平时是顶边 8px 透明热区，悬停/聚焦长成顶栏按钮；只画在沉浸态。 -->
      <button id="hr-immersive-exit" type="button"></button>
      <aside id="hr-library" class="library">
        <h2 id="hr-lib-title"></h2>
        <label id="hr-search-label" for="hr-search">搜索</label>
        <!-- The sidebar search box stays a placeholder: the real input lives in
             `#hr-search-panel` (opened by `/`). `disabled` declares it unusable; the
             desktop workbench strips `disabled` and reuses it as a file filter. -->
        <input id="hr-search" type="search" disabled title="按 / 打开书库搜索" />
        <h3 id="hr-toc-title"></h3>
        <ul id="hr-toc"></ul>
      </aside>
      <main id="hr-canvas" class="canvas">
        <div id="hr-controls" class="controls">
          <label id="hr-theme-label" for="hr-theme-select"></label>
          <select id="hr-theme-select"></select>
          <span id="hr-focus-label"></span>
          <!-- 与 `#hr-note-btn` 同一兜底：无 JS 首帧先藏着，widget 按文档形态摘/挂 `hidden`。 -->
          <button id="hr-present-btn" type="button" hidden></button>
        </div>
        <article id="hr-doc" class="doc"></article>
        <!-- 外来/未规范化文档的横幅与 iframe：默认 `hidden`，由 foreign widget 按 cls 摘/挂。
             iframe 只接 `src`——外来 HTML 绝不进本页 DOM；sandbox 档位由 widget 写。 -->
        <div id="hr-foreign" class="foreign-banner" hidden>
          <span id="hr-foreign-text"></span>
          <button id="hr-foreign-action" type="button" hidden></button>
          <!-- Annotate-mode toggle: foreign docs only (the foreign widget attaches/detaches hidden by cls). -->
          <button id="hr-annotate-btn" type="button" class="perm-toggle" hidden></button>
          <span id="hr-foreign-error" class="foreign-error" role="alert"></span>
        </div>
        <iframe
          id="hr-foreign-frame"
          class="foreign-frame"
          referrerpolicy="no-referrer"
          allow="fullscreen"
          hidden
        ></iframe>
        <!-- Annotate popover: fixed-positioned; position = iframe bounding rect + in-frame selection rect (carried by the frame's message). -->
        <div id="hr-annotate-pop" class="annotate-pop" hidden>
          <textarea
            id="hr-annotate-draft"
            class="annotate-draft"
            rows="4"
            maxlength="2000"
            hidden
          ></textarea>
          <p id="hr-annotate-hint" class="annotate-hint" hidden></p>
          <div id="hr-annotate-actions" class="annotate-actions">
            <button id="hr-annotate-cancel" type="button"></button>
            <button id="hr-annotate-save" type="button" hidden></button>
          </div>
        </div>
      </main>
      <div id="hr-present">
        <span id="hr-present-pager" role="status"></span>
        <button id="hr-present-exit" type="button"></button>
      </div>
      <aside id="hr-notes" class="sidenotes">
        <h3 id="hr-notes-title"></h3>
        <div id="hr-notes-actions" class="notes-actions">
          <!-- `hidden` 只是无 JS 时的首帧兜底：`boot.ts` 的 `syncView` 会在有选区时摘除、失选区时带回。 -->
          <button id="hr-note-btn" type="button" class="note-btn" hidden>批注选区</button>
        </div>
        <div id="hr-note-editor" class="note-editor">
          <label id="hr-note-draft-label" for="hr-note-draft">批注</label>
          <textarea id="hr-note-draft" class="note-draft" rows="3"></textarea>
          <div class="note-editor-actions">
            <button id="hr-note-submit" type="button">提交</button>
            <button id="hr-note-cancel" type="button">取消</button>
          </div>
        </div>
        <!-- 错误/提示放在编辑器外：跨块选区等提示在编辑器关着时也必须看得见。 -->
        <p id="hr-note-error" class="note-error" role="alert"></p>
        <section class="notes-group" aria-labelledby="hr-notes-pending-title">
          <h4 id="hr-notes-pending-title">未处理</h4>
          <ul id="hr-notes-pending" class="notes-list"></ul>
        </section>
        <section class="notes-group" aria-labelledby="hr-notes-resolved-title">
          <h4 id="hr-notes-resolved-title">已归档</h4>
          <ul id="hr-notes-resolved" class="notes-list"></ul>
        </section>
        <div id="hr-notes-body" class="notes-body"></div>
        <section id="hr-diff" class="diff">
          <h4 id="hr-diff-title">改动对比</h4>
          <p id="hr-diff-status"></p>
          <div id="hr-diff-chunks"></div>
        </section>
      </aside>
      <!-- 外来文档批注面板（D55）：只在批注模式可见（`#hr-root[data-hr-annotate]`）；
           卡片文字全部由 ann-panel widget 走 textContent 写入，绝不进 innerHTML。 -->
      <aside id="hr-ann-panel" class="ann-panel" hidden>
        <h3 id="hr-ann-title"></h3>
        <p id="hr-ann-error" class="ann-error" role="alert"></p>
        <section class="ann-group" aria-labelledby="hr-ann-pending-title">
          <h4 id="hr-ann-pending-title"></h4>
          <ul id="hr-ann-pending" class="ann-list"></ul>
        </section>
        <section class="ann-group" aria-labelledby="hr-ann-resolved-title">
          <h4 id="hr-ann-resolved-title"></h4>
          <ul id="hr-ann-resolved" class="ann-list"></ul>
        </section>
        <section
          id="hr-ann-group-lost"
          class="ann-group"
          aria-labelledby="hr-ann-lost-title"
          hidden
        >
          <h4 id="hr-ann-lost-title"></h4>
          <ul id="hr-ann-lost" class="ann-list"></ul>
        </section>
        <p id="hr-ann-empty" class="ann-empty"></p>
      </aside>
      <!-- Library-search panel (opened by `/`, or ⌘K on the desktop shell): `hidden`
           is the fallback while the search widget adds/removes it per `searchOpen`;
           title/path/snippet only ever land via textContent (`mark` highlights are
           text nodes too) — never innerHTML. -->
      <div id="hr-search-panel" class="search-panel" role="dialog" hidden>
        <input
          id="hr-search-input"
          type="search"
          autocomplete="off"
          spellcheck="false"
          role="combobox"
          aria-expanded="true"
        />
        <p id="hr-search-hint" class="search-hint" role="status"></p>
        <section
          id="hr-search-docs"
          class="search-group"
          aria-labelledby="hr-search-docs-title"
          hidden
        >
          <h4 id="hr-search-docs-title"></h4>
          <ul id="hr-search-docs-list" class="search-list" role="listbox"></ul>
        </section>
        <section
          id="hr-search-anns"
          class="search-group"
          aria-labelledby="hr-search-anns-title"
          hidden
        >
          <h4 id="hr-search-anns-title"></h4>
          <ul id="hr-search-anns-list" class="search-list" role="listbox"></ul>
        </section>
      </div>
      <footer id="hr-statusbar" class="statusbar">
        <span id="hr-conn"></span>
        <span id="hr-version"></span>
        <!-- 外来文档的单文档权限开关：`hidden` 兜底，foreign widget 按 cls/permissions 摘挂。 -->
        <span id="hr-perms" hidden>
          <button id="hr-perm-scripts" type="button" class="perm-toggle"></button>
          <button id="hr-perm-network" type="button" class="perm-toggle"></button>
        </span>
        <button id="hr-immersive-btn" type="button"></button>
        <span id="hr-shortcuts"></span>
        <span id="hr-hint" role="status"></span>
      </footer>
    </div>
    <script type="module" src="/assets/main.js"></script>
  </body>
</html>
