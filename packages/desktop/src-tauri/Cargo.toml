[package]
name = "hreader-desktop"
version = "1.0.0"
license = "MIT"
edition = "2021"
rust-version = "1.98.0"
description = "hReader desktop shell: locate hr CLI, manage local daemon, and render the Typora-style reader workspace"

[lib]
name = "hreader_desktop"
path = "src/lib.rs"

[[bin]]
name = "hreader-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook-registry = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
