[package]
name = "hreader-desktop"
version = "0.0.0"
edition = "2021"
rust-version = "1.98.0"
description = "hReader desktop shell: 定位 hr CLI、拉起本地 daemon、把 webview 导航到 daemon 托管的阅读器"

[lib]
name = "hreader_desktop"
path = "src/lib.rs"

[[bin]]
name = "hreader-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
serde_json = "1"
signal-hook-registry = "1"
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
