name: CI
# Jobs run the same gate set as `pnpm verify`, split so lint / test / e2e run in parallel.

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same ref cancels the stale run: old results are worthless, and a
# wedged run would otherwise burn runner minutes until its timeout.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    # Hard ceiling: a wedged step fails in minutes instead of the 6h default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:sh
      - run: pnpm typecheck
      - run: pnpm depcruise
      - run: pnpm knip
      - run: pnpm theme:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Shuffle regression folded into the coverage run instead of a second full
      # vitest pass: same order-sensitivity coverage, half the test time. The random
      # seed is printed in the output so failures stay reproducible.
      - run: pnpm test:coverage --sequence.shuffle

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # ubuntu-latest ships Chrome: both e2e probes (print pagination, foreign
      # document sandbox) run for real in CI.
      - run: pnpm test:e2e
        env:
          CHROME_BIN: /usr/bin/google-chrome
      # Cross-package integration / user journeys (real dist artifacts + real
      # Chrome; the desktop smoke check SKIPs itself on a plain runner).
      - run: pnpm test:integration
        env:
          CHROME_BIN: /usr/bin/google-chrome

  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
      - name: Install the system libraries Tauri needs on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # Independent job alongside `pnpm verify`: the Rust gates stay out of the
      # node matrix.
      - run: bash packages/desktop/scripts/check.sh
