name: CI
# checks job 与 pnpm verify 同序：本地和 CI 跑同一套门禁。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:sh
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:coverage
      # 乱序回归：顺序敏感的失败（共享状态、泄漏句柄、隐式文件依赖）只有打乱才暴露；
      # 种子每次随机，vitest 会在输出里打出 seed，失败可按它复现。
      - run: pnpm vitest run --sequence.shuffle
      # ubuntu-latest 自带 Chrome：两个 e2e 自检脚本（打印稿分页、外来文档沙箱）在 CI 真跑。
      - run: pnpm test:e2e
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - run: pnpm theme:check
      # 跨包集成/用户旅程（真 dist 产物 + 真 Chrome；ubuntu runner 自带 Chrome，desktop 冒烟会自动 SKIP）。
      - run: pnpm test:integration
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - run: pnpm depcruise
      - run: pnpm knip

  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
      - name: 装 Linux 上 Tauri 需要的系统库
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # 与 `pnpm verify` 并列的独立 job：Rust 门禁不掺进 node matrix。
      - run: bash packages/desktop/scripts/check.sh
