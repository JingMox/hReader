name: Mutation
# Mutation testing is too expensive for the PR gate: weekly schedule + manual trigger. The anti-regression threshold is thresholds.break in stryker.config.mjs.

on:
  schedule:
    - cron: "0 18 * * 0" # 18:00 UTC Sundays
  workflow_dispatch:
    inputs:
      mutate:
        description: "glob that limits the mutation scope (comma-separated); leave empty to run the full scope from stryker.config.mjs"
        required: false
        default: ""

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run mutation tests (full or scoped)
        run: |
          if [ -n "${{ inputs.mutate }}" ]; then
            pnpm test:mutation --mutate "${{ inputs.mutate }}"
          else
            pnpm test:mutation
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: .reports-tmp/mutation/
          if-no-files-found: ignore
